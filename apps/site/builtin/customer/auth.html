<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>My licenses</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/theme.css">
  <script type="module" src="/assets/customer-auth.js"></script>
</head>
<body data-page="customer">
  <a class="skip-link" href="#main-content" data-i18n="skipContent">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><img src="/assets/logo.svg" width="32" height="32" alt=""><span data-site-name>LicenKit</span></a>
      <nav class="site-nav" aria-label="Main navigation" data-site-navigation>
        <a href="/pricing" data-nav="pricing" data-i18n="navPricing">Products and prices</a>
        <a href="/customer/" data-nav="customer" data-i18n="navLicenses">My licenses</a>
      </nav>
      <label class="language-field"><span class="sr-only" data-i18n="languageLabel">Language</span><select data-locale-select><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></label>
    </div>
  </header>
  <main id="main-content" class="container page-main">
    <div class="page-heading"><h1 data-customer-i18n="authTitle">Confirm sign-in</h1><p data-customer-i18n="authIntro">Use the button below to sign in and view your licenses.</p></div>
    <div id="page-error" hidden></div>
    <section class="card auth-panel stack">
      <button id="confirm-login" class="button" type="button" disabled data-customer-i18n="confirmLogin">Confirm sign-in</button>
      <div id="invalid-link" class="notice notice-warning" hidden><p data-customer-i18n="invalidLink">This sign-in link is unavailable or has expired. Request a new link.</p></div>
      <a class="button button-secondary" href="/customer/login" data-customer-i18n="requestLink">Request a new sign-in link</a>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><span data-site-name>LicenKit</span><a data-support-link hidden data-i18n="support">Contact support</a></div></footer>
</body>
</html>
