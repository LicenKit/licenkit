<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>My licenses</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/theme.css">
  <script type="module" src="/assets/customer-license.js"></script>
</head>
<body data-page="customer">
  <a class="skip-link" href="#main-content" data-i18n="skipContent">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><img src="/assets/logo.svg" width="32" height="32" alt=""><span data-site-name>LicenKit</span></a>
      <nav class="site-nav" aria-label="Main navigation" data-site-navigation>
        <a href="/pricing" data-nav="pricing" data-i18n="navPricing">Products and prices</a>
        <a href="/customer/" data-nav="customer" data-i18n="navLicenses">My licenses</a>
      </nav>
      <label class="language-field"><span class="sr-only" data-i18n="languageLabel">Language</span><select data-locale-select><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></label>
    </div>
  </header>
  <main id="main-content" class="container page-main">
    <div class="page-heading"><a href="/customer/" data-customer-i18n="back">Back to my licenses</a><div class="section-heading"><h1 data-customer-i18n="detailTitle">License details</h1><button id="reload-license" class="button button-secondary" type="button" disabled data-customer-i18n="retry">Reload</button></div></div>
    <div id="page-error" hidden></div>
    <section id="license-core" class="card stack" aria-live="polite"></section>
    <section id="new-key" class="notice notice-success stack" tabindex="-1" aria-live="polite" hidden></section>
    <div id="action-error" hidden></div>
    <div class="detail-grid">
      <section id="devices-section" class="card stack" hidden><h2 data-customer-i18n="devices">Activated devices</h2><p class="muted" data-customer-i18n="devicesHint">Release a device you no longer use to use the license on another device.</p><div id="devices-content" class="stack" aria-live="polite"></div></section>
      <section id="subscription-section" class="card stack" hidden><h2 data-customer-i18n="subscription">Subscription and renewal</h2><div id="subscription-content" class="stack" aria-live="polite"></div></section>
    </div>
    <div id="license-actions" class="detail-grid"></div>
  </main>
  <footer class="site-footer"><div class="container"><span data-site-name>LicenKit</span><a data-support-link hidden data-i18n="support">Contact support</a></div></footer>
</body>
</html>
