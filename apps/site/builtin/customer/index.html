<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>My licenses</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/theme.css">
  <script type="module" src="/assets/customer-portal.js"></script>
</head>
<body data-page="customer">
  <a class="skip-link" href="#main-content" data-i18n="skipContent">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><img src="/assets/logo.svg" width="32" height="32" alt=""><span data-site-name>LicenKit</span></a>
      <nav class="site-nav" aria-label="Main navigation" data-site-navigation>
        <a href="/pricing" data-nav="pricing" data-i18n="navPricing">Products and prices</a>
        <a href="/customer/" data-nav="customer" data-i18n="navLicenses">My licenses</a>
      </nav>
      <label class="language-field"><span class="sr-only" data-i18n="languageLabel">Language</span><select data-locale-select><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></label>
    </div>
  </header>
  <main id="main-content" class="container page-main">
    <div class="page-heading"><h1 data-customer-i18n="portalTitle">My licenses</h1><p data-customer-i18n="portalIntro">View your purchased products, access periods, and activated devices.</p></div>
    <div class="section-heading"><div id="customer-account" class="stack"></div><div class="inline-actions"><button id="reload-licenses" class="button button-secondary" type="button" disabled data-customer-i18n="retry">Reload</button><button id="logout" class="button button-secondary" type="button" disabled data-customer-i18n="logout">Sign out</button></div></div>
    <div id="page-error" hidden></div>
    <div id="licenses" class="license-list stack" aria-live="polite"></div>
  </main>
  <footer class="site-footer"><div class="container"><span data-site-name>LicenKit</span><a data-support-link hidden data-i18n="support">Contact support</a></div></footer>
</body>
</html>
