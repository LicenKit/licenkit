<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>LicenKit Checkout — Vanilla JavaScript</title>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="product-title">
        <p class="eyebrow">Licensed software</p>
        <h1 id="product-title" data-product-title>Product checkout</h1>
        <p class="description" data-product-description></p>
        <p class="status" data-checkout-status aria-live="polite">Loading current offers…</p>
        <div class="offers" data-offers></div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
